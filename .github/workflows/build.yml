# dLLM CI/CD Pipeline
# Build, test, and deploy dLLM on remote build server

name: Build and Deploy

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  BUILD_SERVER: 192.168.10.7
  BUILD_USER: saszel
  BUILD_DIR: /home/saszel/dLLM-build

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config:
          - name: SSE4.2
            cmake_flags: "-DUSE_SSE42=ON -DUSE_AVX=OFF -DUSE_AVX2=OFF"
          - name: AVX2
            cmake_flags: "-DUSE_SSE42=ON -DUSE_AVX=ON -DUSE_AVX2=ON"
          - name: Release
            cmake_flags: "-DUSE_SSE42=ON -DUSE_AVX=ON -DUSE_AVX2=ON -DCMAKE_BUILD_TYPE=Release"
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: SSH to build server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ env.BUILD_SERVER }}
        username: ${{ env.BUILD_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # Create build directory
          mkdir -p ${{ env.BUILD_DIR }}
          
          # Clone repository if not exists
          if [ ! -d "${{ env.BUILD_DIR }}/dLLM" ]; then
            git clone https://github.com/${{ github.repository }}.git ${{ env.BUILD_DIR }}/dLLM
          fi
          
          # Pull latest changes
          cd ${{ env.BUILD_DIR }}/dLLM
          git pull origin ${{ github.ref }}
          
          # Configure build
          cd ${{ env.BUILD_DIR }}/dLLM/build
          cmake ${{ matrix.config.cmake_flags }} ..
          
          # Build
          make -j$(nproc)
          
          # Run tests if available
          if [ -f "test" ]; then
            ./test
          fi

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dLLM-${{ matrix.config.name }}
        path: |
          ${{ env.BUILD_DIR }}/dLLM/build/libdllm.so
          ${{ env.BUILD_DIR }}/dLLM/build/libdllm_engine.so
          ${{ env.BUILD_DIR }}/dLLM/build/libdllm_tensor.so
          ${{ env.BUILD_DIR }}/dLLM/build/libdllm_comm.so

  build-python:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Build Python wheel
      run: |
        cd src/python
        uv build --wheel
        
    - name: Upload Python wheel
      uses: actions/upload-artifact@v4
      with:
        name: dLLM-python-wheel
        path: src/python/dist/*.whl

  publish:
    runs-on: ubuntu-latest
    needs: [build, build-python]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Publish to PyPI
      if: startsWith(github.event.head_commit.message, 'v')
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        packages-dir: artifacts/dLLM-python-wheel/
          
          # Build SSE4.2 version for fallback
          cd /home/saszel/dLLM
          mkdir -p build_sse42 && cd build_sse42
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DUSE_SSE42=ON \
                -DUSE_AVX=OFF \
                -DUSE_AVX2=OFF \
                ..
          make -j$(nproc)

  # Deploy to Node 2 (192.168.10.5) with rsync
  deploy-node2-rsync:
    needs: [build-linux]
    
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install rsync
      run: sudo apt-get install -y rsync

    - name: Sync source to Node 2 (SSE4.2 only)
      uses: appleboy/rsync-action@v1.0.0
      with:
        host: 192.168.10.5
        username: saszel
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: ./
        target: /home/saszel/dLLM/
        options: '-avz --delete-excluded --exclude-from=.gitignore'

    - name: Build on Node 2 (SSE4.2 only)
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: 192.168.10.5
        username: saszel
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /home/saszel/dLLM
          
          # Build SSE4.2 only version
          mkdir -p build_sse42 && cd build_sse42
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DUSE_SSE42=ON \
                -DUSE_AVX=OFF \
                -DUSE_AVX2=OFF \
                ..
          make -j$(nproc)

  create-release:
    needs: [deploy-node1-rsync, deploy-node2-rsync]
    
    if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'v')
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        pip install build twine

    - name: Build Python wheel
      run: |
        cd src/python
        python -m build

    - name: Upload Python wheels to release
      uses: softprops/action-gh-release@v1
      with:
        files: dist/*.whl
        token: ${{ secrets.GITHUB_TOKEN }}